name: Build Wheel

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to attach the wheel to (example: v0.1.2). Leave blank to only build."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag=""
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.release_tag }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check version matches the tag
        if: steps.release.outputs.tag != ''
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          want="${tag#v}"
          py_ver=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          manifest_ver=$(python -c 'import json; print(json.load(open("openhop-plugin.json"))["version"])')
          echo "tag=${want} pyproject=${py_ver} openhop-plugin.json=${manifest_ver}"
          if [[ "${py_ver}" != "${want}" || "${manifest_ver}" != "${want}" ]]; then
            echo "::error::version in pyproject.toml / openhop-plugin.json does not match tag ${tag}"
            exit 1
          fi
          ls dist/*-"${want}"-py3-none-any.whl

      - name: Write SHA-256 digest and catalogue entry
        shell: bash
        run: |
          cd dist
          wheel=$(ls *.whl)
          sha256sum "${wheel}" > "${wheel}.sha256"
          cd ..
          python scripts/catalogue_entry.py "dist/${wheel}" > dist/catalogue-entry.json
          {
            echo "## Wheel"
            echo
            echo '```'
            cat "dist/${wheel}.sha256"
            echo '```'
            echo
            echo "## openHop plugin catalogue entry"
            echo
            echo '```json'
            cat dist/catalogue-entry.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhop-txmesh-plugin-wheel
          path: |
            dist/*.whl
            dist/*.sha256
            dist/catalogue-entry.json
          if-no-files-found: error

      - name: Attach wheel to GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.sha256
            dist/catalogue-entry.json
