name: Build Wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish assets to (example: v0.1.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel

      - name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          fi

      - name: Create zipped wheel bundle
        shell: bash
        run: |
          mkdir -p release-assets
          zip_name="openhop-txmesh-plugin-${RELEASE_TAG}-wheel.zip"
          (
            cd dist
            zip -j "../release-assets/${zip_name}" *.whl
          )
          echo "WHEEL_ZIP=release-assets/${zip_name}" >> "$GITHUB_ENV"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openhop-txmesh-plugin-wheel
          path: |
            dist/*.whl
            ${{ env.WHEEL_ZIP }}

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.whl
            ${{ env.WHEEL_ZIP }}
