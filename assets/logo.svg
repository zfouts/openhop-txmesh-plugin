<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- mesh links -->
  <g stroke="#3ddc97" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="128" y1="352" x2="256" y2="184"/>
    <line x1="256" y1="184" x2="384" y2="352"/>
    <line x1="128" y1="352" x2="384" y2="352"/>
  </g>
  <!-- relay nodes -->
  <g fill="#3ddc97">
    <circle cx="128" cy="352" r="30"/>
    <circle cx="384" cy="352" r="30"/>
  </g>
  <!-- source node -->
  <circle cx="256" cy="184" r="38" fill="#ffffff"/>
  <!-- outgoing waves -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M196 118 A 86 86 0 0 1 316 118"/>
    <path d="M216 150 A 56 56 0 0 1 296 150" opacity="0.75"/>
  </g>
  <!-- uplink arrow to the collector -->
  <g stroke="#ffb84d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="256" y1="440" x2="256" y2="396"/>
    <polyline points="226,424 256,394 286,424"/>
  </g>
</svg>
